<section class="card">
  <h2>My Homelab Layers of defense.</h2>

  <svg
    #rings
    class="rings"
    viewBox="-340 -340 680 680"
    role="img"
    aria-label="Six rings of defense around the container. Most attacks stop at the fourth, the web server."
    [class.focus]="active()"
  >
    @for (w of walls(); track w.name) {
      <circle
        class="wall"
        [class.stop]="w.share > 0"
        [class.calm]="w.calm"
        [class.on]="active() === w.name"
        [style.--heat]="w.share"
        [attr.r]="w.r"
        (pointerenter)="active.set(w.name)"
        (pointerleave)="active.set(null)"
      />
      <text [class.stop]="w.share > 0" [class.on]="active() === w.name" [attr.y]="w.labelY">
        {{ w.name }}
      </text>
    }
    <g class="shots" aria-hidden="true">
      @for (s of shots(); track s.key) {
        <g [attr.transform]="s.turn" [style.--stop.px]="s.stopAt">
          <circle class="shot" [class.edge]="s.edge" r="5" />
          <circle class="spark" [class.edge]="s.edge" [attr.cx]="s.stopAt" r="5" />
        </g>
      }
    </g>
  </svg>

  <ol>
    @for (w of walls(); track w.name) {
      <li
        [class.stop]="w.share > 0"
        [class.on]="active() === w.name"
        (pointerenter)="active.set(w.name)"
        (pointerleave)="active.set(null)"
      >
        <div>
          <span>{{ w.name }}</span><small>{{ w.tool }}</small>
        </div>
        <b>
          @if (w.count !== null) {
            <i>{{ w.count | number }}</i>
          } @else if (w.none) {
            <i class="zero">0</i>
          }
        </b>
      </li>
    }
  </ol>

  <!-- These three watch every wall, so they have no ring of their own. -->
  <p class="plus">Plus signed images, patching and alerts.</p>
</section>
